<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Alerts App</title>
  <link rel="stylesheet" href="styles.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main>
    <h1>Weather Alerts App</h1>
    <label for="state-input">State abbreviation</label>
    <input id="state-input" type="text" placeholder="Enter state abbreviation" maxlength="2">
    <button id="fetch-alerts" type="button">Get Weather Alerts</button>
    <div id="error-message" class="hidden" role="alert"></div>
    <div id="alerts-display" aria-live="polite"></div>
  </main>
</body>
</html>
