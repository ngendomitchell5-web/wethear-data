<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US Weather Alerts</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>US Weather Alerts</h1>
    <p>Enter a US state code, such as CA or NY.</p>
    <form id="search-form">
      <label for="state">State code</label>
      <input id="state" maxlength="2" placeholder="CA" required>
      <button>Find alerts</button>
    </form>
    <p id="message" role="status">Search for active alerts.</p>
    <ul id="alerts"></ul>
  </main>
</body>
</html>
